name: test | mcp

on:
  workflow_call:
    inputs:
      python-version:
        required: false
        type: string
        default: '3.11.x'

env:
  RUNTIME__LOG_LEVEL: ERROR
  ENV: 'dev'
  LLM_MOCK_RESPONSES: 'true'
  MOCK_EMBEDDING: 'true'
  ENABLE_BACKEND_ACCESS_CONTROL: 'false'
  REQUIRE_AUTHENTICATION: 'false'

jobs:
  test-mcp:
    name: Run MCP Test
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install UV
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install uv

      # This will install all dependencies along with Cognee version deployed on PIP
      - name: Install dependencies
        shell: bash
        working-directory: cognee-mcp
        run: uv sync

      # NEW: swap in current local cognee branch version
      - name: Override with cognee branch checkout
        working-directory: cognee-mcp
        run: |
         # Remove Cognee wheel that came from PyPI
         uv pip uninstall cognee
         # Install of the freshly-checked-out Cognee branch
         uv pip install --force-reinstall -e ../

      - name: Run MCP test
        env:
          ENV: 'dev'
          LLM_MODEL: ${{ secrets.LLM_MODEL || 'gpt-4o-mini' }}
          LLM_ENDPOINT: ${{ secrets.LLM_ENDPOINT || 'https://mock-llm.invalid' }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY || 'test-llm-key' }}
          LLM_API_VERSION: ${{ secrets.LLM_API_VERSION || '2024-05-01' }}
          LLM_MOCK_RESPONSES: 'true'
          EMBEDDING_MODEL: ${{ secrets.EMBEDDING_MODEL || 'text-embedding-3-small' }}
          EMBEDDING_ENDPOINT: ${{ secrets.EMBEDDING_ENDPOINT || 'https://mock-embedding.invalid' }}
          EMBEDDING_API_KEY: ${{ secrets.EMBEDDING_API_KEY || 'test-embedding-key' }}
          EMBEDDING_API_VERSION: ${{ secrets.EMBEDDING_API_VERSION || '2024-05-01' }}
        working-directory: cognee-mcp
        run: uv run --no-sync python ./src/test_client.py
