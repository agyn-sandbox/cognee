name: test-notebook

on:
  workflow_call:
    inputs:
      notebook-location:
        description: "Location of Jupyter notebook to run"
        required: true
        type: string
    secrets:
      LLM_API_KEY:
        required: false
      OPENAI_API_KEY:
        required: false
      EMBEDDING_MODEL:
        required: false
      EMBEDDING_ENDPOINT:
        required: false
      EMBEDDING_API_KEY:
        required: false
      EMBEDDING_API_VERSION:
        required: false

env:
  RUNTIME__LOG_LEVEL: ERROR
  LLM_MOCK_RESPONSES: 'true'
  MOCK_EMBEDDING: 'true'
  ENABLE_BACKEND_ACCESS_CONTROL: 'false'
  REQUIRE_AUTHENTICATION: 'false'

jobs:

  run_notebook_test:
    name: test
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@master

      - name: Cognee Setup
        uses: ./.github/actions/cognee_setup
        with:
          python-version: ${{ inputs.python-version }}
          extra-dependencies: "notebook"

      - name: Execute Jupyter Notebook
        env:
          ENV: 'dev'
          #LLM_MODEL: ${{ secrets.LLM_MODEL }}
          #LLM_ENDPOINT: ${{ secrets.LLM_ENDPOINT }}
          LLM_API_KEY: ${{ secrets.OPENAI_API_KEY || 'test-llm-key' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'test-llm-key' }} # Use OpenAI Until a multimedia model is deployed and DeepEval support for other models is added
          #LLM_API_VERSION: ${{ secrets.LLM_API_VERSION }}
          EMBEDDING_MODEL: ${{ secrets.EMBEDDING_MODEL || 'text-embedding-3-small' }}
          EMBEDDING_ENDPOINT: ${{ secrets.EMBEDDING_ENDPOINT || 'https://mock-embedding.invalid' }}
          EMBEDDING_API_KEY: ${{ secrets.EMBEDDING_API_KEY || 'test-embedding-key' }}
          EMBEDDING_API_VERSION: ${{ secrets.EMBEDDING_API_VERSION || '2024-05-01' }}
        run: |
          uv run jupyter nbconvert \
          --to notebook \
          --execute ${{ inputs.notebook-location }} \
          --output executed_notebook.ipynb \
          --ExecutePreprocessor.timeout=1200
