name: Reusable Basic Tests

on:
  workflow_call:
    inputs:
      python-version:
        required: false
        type: string
        default: '3.11.x'
    secrets:
      LLM_PROVIDER:
        required: false
      LLM_MODEL:
        required: false
      LLM_ENDPOINT:
        required: false
      LLM_API_KEY:
        required: false
      LLM_API_VERSION:
        required: false
      EMBEDDING_PROVIDER:
        required: false
      EMBEDDING_MODEL:
        required: false
      EMBEDDING_ENDPOINT:
        required: false
      EMBEDDING_API_KEY:
        required: false
      EMBEDDING_API_VERSION:
        required: false

env:
  RUNTIME__LOG_LEVEL: ERROR
  ENV: 'dev'
  LLM_MOCK_RESPONSES: 'true'
  MOCK_EMBEDDING: 'true'
  ENABLE_BACKEND_ACCESS_CONTROL: 'false'
  REQUIRE_AUTHENTICATION: 'false'

jobs:

  lint:
    name: Run Linting
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cognee Setup
        uses: ./.github/actions/cognee_setup
        with:
          python-version: ${{ inputs.python-version }}

      - name: Run Linting
        uses: astral-sh/ruff-action@v2

  format-check:
    name: Run Formatting Check
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cognee Setup
        uses: ./.github/actions/cognee_setup
        with:
          python-version: ${{ inputs.python-version }}

      - name: Run Formatting Check
        uses: astral-sh/ruff-action@v2
        with:
          args: "format --check"

  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-22.04
    env:
      ENV: 'dev'
      LLM_PROVIDER: ${{ secrets.LLM_PROVIDER || 'openai' }}
      LLM_MODEL: ${{ secrets.LLM_MODEL || 'gpt-4o-mini' }}
      LLM_ENDPOINT: ${{ secrets.LLM_ENDPOINT || 'https://mock-llm.invalid' }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY || 'test-llm-key' }}
      LLM_API_VERSION: ${{ secrets.LLM_API_VERSION || '2024-05-01' }}
      LLM_MOCK_RESPONSES: 'true'

      EMBEDDING_PROVIDER: ${{ secrets.EMBEDDING_PROVIDER || 'openai' }}
      EMBEDDING_MODEL: ${{ secrets.EMBEDDING_MODEL || 'text-embedding-3-small' }}
      EMBEDDING_ENDPOINT: ${{ secrets.EMBEDDING_ENDPOINT || 'https://mock-embedding.invalid' }}
      EMBEDDING_API_KEY: ${{ secrets.EMBEDDING_API_KEY || 'test-embedding-key' }}
      EMBEDDING_API_VERSION: ${{ secrets.EMBEDDING_API_VERSION || '2024-05-01' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cognee Setup
        uses: ./.github/actions/cognee_setup
        with:
          python-version: ${{ inputs.python-version }}

      - name: Run Unit Tests
        run: uv run pytest cognee/tests/unit/

  integration-tests:
    name: Run Integration Tests
    runs-on: ubuntu-22.04
    env:
      ENV: 'dev'
      LLM_PROVIDER: ${{ secrets.LLM_PROVIDER || 'openai' }}
      LLM_MODEL: ${{ secrets.LLM_MODEL || 'gpt-4o-mini' }}
      LLM_ENDPOINT: ${{ secrets.LLM_ENDPOINT || 'https://mock-llm.invalid' }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY || 'test-llm-key' }}
      LLM_API_VERSION: ${{ secrets.LLM_API_VERSION || '2024-05-01' }}
      LLM_MOCK_RESPONSES: 'true'
      EMBEDDING_MODEL: ${{ secrets.EMBEDDING_MODEL || 'text-embedding-3-small' }}
      EMBEDDING_ENDPOINT: ${{ secrets.EMBEDDING_ENDPOINT || 'https://mock-embedding.invalid' }}
      EMBEDDING_API_KEY: ${{ secrets.EMBEDDING_API_KEY || 'test-embedding-key' }}
      EMBEDDING_API_VERSION: ${{ secrets.EMBEDDING_API_VERSION || '2024-05-01' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cognee Setup
        uses: ./.github/actions/cognee_setup
        with:
          python-version: ${{ inputs.python-version }}
          extra-dependencies: "scraping"

      - name: Run Integration Tests
        run: uv run pytest cognee/tests/integration/

  simple-examples:
    name: Run Simple Examples
    runs-on: ubuntu-22.04
    env:
      ENV: 'dev'
      LLM_PROVIDER: ${{ secrets.LLM_PROVIDER || 'openai' }}
      LLM_MODEL: ${{ secrets.LLM_MODEL || 'gpt-4o-mini' }}
      LLM_ENDPOINT: ${{ secrets.LLM_ENDPOINT || 'https://mock-llm.invalid' }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY || 'test-llm-key' }}
      LLM_API_VERSION: ${{ secrets.LLM_API_VERSION || '2024-05-01' }}
      LLM_MOCK_RESPONSES: 'true'

      EMBEDDING_PROVIDER: ${{ secrets.EMBEDDING_PROVIDER || 'openai' }}
      EMBEDDING_MODEL: ${{ secrets.EMBEDDING_MODEL || 'text-embedding-3-small' }}
      EMBEDDING_ENDPOINT: ${{ secrets.EMBEDDING_ENDPOINT || 'https://mock-embedding.invalid' }}
      EMBEDDING_API_KEY: ${{ secrets.EMBEDDING_API_KEY || 'test-embedding-key' }}
      EMBEDDING_API_VERSION: ${{ secrets.EMBEDDING_API_VERSION || '2024-05-01' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cognee Setup
        uses: ./.github/actions/cognee_setup
        with:
          python-version: ${{ inputs.python-version }}

      - name: Run Simple Examples
        run: uv run python ./examples/python/simple_example.py

  simple-examples-baml:
    name: Run Simple Examples BAML
    runs-on: ubuntu-22.04
    env:
      ENV: 'dev'
      STRUCTURED_OUTPUT_FRAMEWORK: "BAML"
      BAML_LLM_PROVIDER: ${{ secrets.LLM_PROVIDER || 'openai' }}
      BAML_LLM_MODEL: ${{ secrets.LLM_MODEL || 'gpt-4o-mini' }}
      BAML_LLM_ENDPOINT: ${{ secrets.LLM_ENDPOINT || 'https://mock-llm.invalid' }}
      BAML_LLM_API_KEY: ${{ secrets.LLM_API_KEY || 'test-llm-key' }}
#      BAML_LLM_API_VERSION: ${{ secrets.LLM_API_VERSION }}

      LLM_PROVIDER: ${{ secrets.LLM_PROVIDER || 'openai' }}
      LLM_MODEL: ${{ secrets.LLM_MODEL || 'gpt-4o-mini' }}
      LLM_ENDPOINT: ${{ secrets.LLM_ENDPOINT || 'https://mock-llm.invalid' }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY || 'test-llm-key' }}
      LLM_API_VERSION: ${{ secrets.LLM_API_VERSION || '2024-05-01' }}
      LLM_MOCK_RESPONSES: 'true'

      EMBEDDING_PROVIDER: ${{ secrets.EMBEDDING_PROVIDER || 'openai' }}
      EMBEDDING_MODEL: ${{ secrets.EMBEDDING_MODEL || 'text-embedding-3-small' }}
      EMBEDDING_ENDPOINT: ${{ secrets.EMBEDDING_ENDPOINT || 'https://mock-embedding.invalid' }}
      EMBEDDING_API_KEY: ${{ secrets.EMBEDDING_API_KEY || 'test-embedding-key' }}
      EMBEDDING_API_VERSION: ${{ secrets.EMBEDDING_API_VERSION || '2024-05-01' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cognee Setup
        uses: ./.github/actions/cognee_setup
        with:
          python-version: ${{ inputs.python-version }}
          extra-dependencies: "baml"

      - name: Run Simple Examples
        run: uv run python ./examples/python/simple_example.py

  graph-tests:
    name: Run Basic Graph Tests
    runs-on: ubuntu-22.04
    env:
      ENV: 'dev'
      LLM_PROVIDER: openai
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
      LLM_ENDPOINT: ${{ secrets.LLM_ENDPOINT }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_API_VERSION: ${{ secrets.LLM_API_VERSION }}

      EMBEDDING_PROVIDER: openai
      EMBEDDING_MODEL: ${{ secrets.EMBEDDING_MODEL }}
      EMBEDDING_ENDPOINT: ${{ secrets.EMBEDDING_ENDPOINT }}
      EMBEDDING_API_KEY: ${{ secrets.EMBEDDING_API_KEY }}
      EMBEDDING_API_VERSION: ${{ secrets.EMBEDDING_API_VERSION }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cognee Setup
        uses: ./.github/actions/cognee_setup
        with:
          python-version: ${{ inputs.python-version }}

      - name: Run Graph Tests
        run: uv run python ./examples/python/code_graph_example.py --repo_path ./cognee/tasks/graph
